name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci

  python:
    name: python SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: lookspan (core)
        working-directory: python/lookspan-core
        run: |
          pip install --quiet pytest ruff .
          ruff check src tests
          pytest -q

      - name: lookspan-langgraph
        working-directory: python/lookspan-langgraph
        run: |
          pip install --quiet pytest ruff ../lookspan-core .
          ruff check src tests
          pytest -q

      # crewai itself is only imported inside `attach()`, and installing it
      # pulls a large, slow dependency tree. Install the adapter without its
      # deps: every span-building path is exercised with stand-in events.
      - name: lookspan-crewai
        working-directory: python/lookspan-crewai
        run: |
          pip install --quiet pytest ruff ../lookspan-core
          pip install --quiet --no-deps .
          ruff check src tests
          pytest -q
