[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookspan"
version = "0.5.3"
description = "Local-first observability for AI agents: emit spans from LangGraph, CrewAI, MCP or your own code to a dashboard that runs on your machine — no cloud, no account, no vendor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Martin" }]
maintainers = [{ name = "Jonathan Martin" }]
keywords = [
  "ai",
  "agents",
  "observability",
  "tracing",
  "spans",
  "telemetry",
  "instrumentation",
  "monitoring",
  "debugging",
  "llm",
  "llmops",
  "mcp",
  "model-context-protocol",
  "langchain",
  "langgraph",
  "crewai",
  "openai",
  "anthropic",
  "local-first",
  "self-hosted",
  "lookspan",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://fervon.dev/lookspan/"
Documentation = "https://jonimartin27.github.io/lookspan/"
Repository = "https://github.com/JoniMartin27/lookspan"
Issues = "https://github.com/JoniMartin27/lookspan/issues"
Changelog = "https://github.com/JoniMartin27/lookspan/blob/main/CHANGELOG.md"
Source = "https://github.com/JoniMartin27/lookspan"

[tool.hatch.build.targets.wheel]
packages = ["src/lookspan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
