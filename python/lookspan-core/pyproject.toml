[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookspan"
version = "0.0.1"
description = "Lookspan Python SDK — emit spans from AI agents to the local-first observability dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Martin" }]
keywords = ["ai", "agents", "observability", "tracing", "mcp", "llm", "lookspan"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/lookspan/lookspan"
Issues = "https://github.com/lookspan/lookspan/issues"
Source = "https://github.com/lookspan/lookspan"

[tool.hatch.build.targets.wheel]
packages = ["src/lookspan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
