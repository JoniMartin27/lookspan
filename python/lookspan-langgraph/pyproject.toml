[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookspan-langgraph"
version = "0.6.0"
description = "LangChain and LangGraph observability, local-first: a callback handler that traces chains, graph nodes, LLM calls and tools to a Lookspan dashboard on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Martin" }]
maintainers = [{ name = "Jonathan Martin" }]
keywords = [
  "langchain",
  "langgraph",
  "lookspan",
  "observability",
  "tracing",
  "spans",
  "telemetry",
  "instrumentation",
  "monitoring",
  "callback-handler",
  "agents",
  "ai",
  "llm",
  "llmops",
  "local-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "lookspan>=0.6.0",
  "langchain-core>=0.3.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]

[project.urls]
Homepage = "https://fervon.dev/lookspan/"
Documentation = "https://fervon.dev/lookspan/"
Repository = "https://github.com/JoniMartin27/lookspan"
Issues = "https://github.com/JoniMartin27/lookspan/issues"
Changelog = "https://github.com/JoniMartin27/lookspan/blob/main/CHANGELOG.md"
Source = "https://github.com/JoniMartin27/lookspan"

[tool.hatch.build.targets.wheel]
packages = ["src/lookspan_langgraph"]
