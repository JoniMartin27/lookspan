[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookspan-crewai"
version = "0.1.1"
description = "Lookspan adapter for CrewAI — emits spans for crew kickoffs, agent execution, tasks, tools, and LLM calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Martin" }]
keywords = ["lookspan", "crewai", "observability", "tracing", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "lookspan>=0.1.0",
  "crewai>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/JoniMartin27/lookspan"
Issues = "https://github.com/JoniMartin27/lookspan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lookspan_crewai"]
